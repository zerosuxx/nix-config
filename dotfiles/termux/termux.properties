extra-keys = [ \
 ['ESC','|', '/', '~','HOME','UP','END'], \
 ['CTRL', 'TAB', '=', '-','LEFT','DOWN','RIGHT'] \
]

# Let external apps read files handed to them through the app's content
# provider, which is what termux-open / xdg-open rely on for a file: the
# other app never sees the path, only a content:// URI backed by an fd the
# Termux app opens itself.
allow-external-apps = true
